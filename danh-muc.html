<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh mục sản phẩm - TNNT Ceramics</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<main class="wrap">
  <nav class="crumbs"><a href="index.html">Trang chủ</a> / Danh mục sản phẩm</nav>
  <div class="layout">
    <aside class="filter" aria-label="Bộ lọc sản phẩm">
      <fieldset>
        <h3>Tìm kiếm sản phẩm</h3>
        <input type="text" id="fName" placeholder="Nhập từ khoá tìm kiếm">
      </fieldset>
      <fieldset>
        <h3>Phân loại</h3>
        <select id="fCat"></select>
      </fieldset>
      <fieldset>
        <h3>Thương hiệu</h3>
        <select id="fBrand"></select>
      </fieldset>
      <fieldset>
        <h3>Khoảng giá</h3>
        <select id="fPrice">
          <option>Tất cả mức giá</option>
          <option>Dưới 500.000đ</option>
          <option>500.000đ - 1.000.000đ</option>
          <option>1.000.000đ - 3.000.000đ</option>
          <option>3.000.000đ - 10.000.000đ</option>
          <option>Trên 10.000.000đ</option>
        </select>
      </fieldset>
      <button class="btn" id="apply" type="button">Lọc sản phẩm</button>
    </aside>

    <section>
      <div class="result-bar"><h1>Tất cả sản phẩm</h1><span id="count"></span></div>
      <div class="grid" id="list"></div>
      <ul class="pager" id="pager" aria-label="Phân trang"></ul>
    </section>
  </div>
</main>

<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  renderLayout('list');
  var PER_PAGE = 12;
  var pages = Math.ceil(PRODUCTS.length / PER_PAGE);

  // Giao diện tĩnh: luôn hiển thị trang 1 (12 sản phẩm đầu), thao tác lọc/phân trang chỉ phản hồi trên giao diện.
  document.getElementById('list').innerHTML = PRODUCTS.slice(0, PER_PAGE).map(cardHTML).join('');
  document.getElementById('count').textContent = 'Hiển thị ' + PER_PAGE + ' / ' + PRODUCTS.length + ' sản phẩm';

  var catHTML = '<option value="all">Tất cả phân loại</option>';
  CATEGORIES.forEach(function (c) {
    catHTML += '<option value="' + c.id + '">' + c.name + '</option>';
  });
  document.getElementById('fCat').innerHTML = catHTML;

  var brands = [];
  PRODUCTS.forEach(function (p) {
    if (p.brand !== 'Đang cập nhật' && brands.indexOf(p.brand) === -1) brands.push(p.brand);
  });
  document.getElementById('fBrand').innerHTML = '<option value="all">Tất cả thương hiệu</option>' +
    brands.map(function (b) { return '<option value="' + b + '">' + b + '</option>'; }).join('');

  var pagerHTML = '';
  for (var i = 1; i <= pages; i++) {
    pagerHTML += '<li><button type="button" data-page="' + i + '"' + (i === 1 ? ' class="on" aria-current="page"' : '') + '>' + i + '</button></li>';
  }
  document.getElementById('pager').innerHTML = pagerHTML;
  document.getElementById('pager').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    toast('Đã chuyển sang trang ' + b.dataset.page);
  });
  document.getElementById('apply').addEventListener('click', function () {
    toast('Đã áp dụng bộ lọc');
  });
</script>
</body>
</html>
