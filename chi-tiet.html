<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết sản phẩm - TNNT Ceramics</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<main class="wrap">
  <nav class="crumbs" id="crumbs"></nav>
  <article class="detail" id="detail"></article>

  <section class="section">
    <div class="section-head"><h2>Sản phẩm cùng danh mục</h2></div>
    <div class="grid" id="related"></div>
  </section>
</main>

<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
  renderLayout('list');
  var id = parseInt(new URLSearchParams(location.search).get('id'), 10) || 1;
  var p = PRODUCTS.find(function (x) { return x.id === id; }) || PRODUCTS[0];
  document.title = p.name + ' - TNNT Ceramics';

  document.getElementById('crumbs').innerHTML =
    '<a href="' + LINKS.home + '">Trang chủ</a> / <a href="' + LINKS.list + '">Danh mục sản phẩm</a> / ' + catName(p.cat);

  document.getElementById('detail').innerHTML =
    '<div class="pic">' + imgTag(p) + '</div>' +
    '<div><span class="tag">' + catName(p.cat) + '</span>' +
    '<h1>' + p.name + '</h1>' +
    '<div class="price">' + money(p.price) + '</div>' +
    '<ul class="meta"><li><b>Mã sản phẩm</b>' + p.id + '</li><li><b>Thương hiệu</b>' + p.brand + '</li><li><b>Tình trạng</b>' + p.status + '</li></ul>' +
    '<p class="desc">' + p.desc + '</p>' +
    '<div class="buy"><div class="qty"><button type="button" id="minus" aria-label="Giảm số lượng">-</button>' +
    '<input type="number" id="qty" value="1" min="1" max="99" aria-label="Số lượng">' +
    '<button type="button" id="plus" aria-label="Tăng số lượng">+</button></div>' +
    '<button class="btn" type="button" id="add">Thêm vào giỏ hàng</button></div></div>';

  var qty = document.getElementById('qty');
  function clamp() { var v = parseInt(qty.value, 10); qty.value = isNaN(v) || v < 1 ? 1 : Math.min(v, 99); }
  document.getElementById('minus').onclick = function () { clamp(); qty.value = Math.max(1, +qty.value - 1); };
  document.getElementById('plus').onclick = function () { clamp(); qty.value = Math.min(99, +qty.value + 1); };
  qty.onchange = clamp;
  // Giao diện tĩnh: chỉ báo thành công, không lưu giỏ hàng
  document.getElementById('add').onclick = function () {
    clamp();
    toast('Đã thêm ' + qty.value + ' sản phẩm vào giỏ hàng');
  };

  document.getElementById('related').innerHTML = PRODUCTS.filter(function (x) {
    return x.cat === p.cat && x.id !== p.id;
  }).slice(0, 4).map(cardHTML).join('');
</script>
</body>
</html>
