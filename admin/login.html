<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị - TNNT Ceramics</title>
  <link rel="icon" href="sidebar/img/logo.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-page">

    <!-- ==========================================================
         1. CỘT TRÁI: logo và giới thiệu (màu xanh navy giống sidebar)
         ========================================================== -->
    <aside class="brand-panel">
      <div class="brand">
        <img src="sidebar/img/logo.png" alt="Logo TNNT Ceramics">
        <div>
          <strong>TNNT Ceramics</strong>
          <small>Quản trị</small>
        </div>
      </div>

      <div class="brand-body">
        <h2 class="brand-title">Quản lý người dùng, lịch sử mua hàng và sản phẩm gốm.</h2>
      </div>

      <p class="brand-foot">© TNNT Ceramics · Khu vực dành cho quản trị viên</p>
    </aside>


    <!-- ==========================================================
         2. CỘT PHẢI: khung đăng nhập (nền kem giống user.html)
         ========================================================== -->
    <main class="login-side">
      <div class="login-card">
        <h1>Đăng nhập</h1>
        
        <!-- THAY ĐỔI: Thêm action="user.html" và method="GET" để khi bấm submit sẽ chuyển thẳng trang -->
        <form class="login-form" id="login-form" action="user.html" method="GET">

          <!-- THAY ĐỔI: Khối báo lỗi #login-error đã ẩn hẳn đi, không cần hiển thị nữa -->

          <div class="form-group">
            <label for="login-email">Email quản trị</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24">
                <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
                <polyline points="22 6 12 13 2 6"></polyline>
              </svg>
              <!-- THAY ĐỔI: Đổi type="text" và XÓA BỎ 'required' để nhập bừa hoặc để trống vẫn hợp lệ -->
              <input type="text" id="login-email" name="email" class="form-control"
                     placeholder="hgnam@ceramics.vn" autocomplete="username" autofocus>
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Mật khẩu</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <!-- THAY ĐỔI: XÓA BỎ 'required' để không bắt buộc gõ mật khẩu -->
              <input type="password" id="login-password" name="password" class="form-control"
                     placeholder="Nhập mật khẩu" autocomplete="current-password">
            </div>
          </div>

          <label class="form-check">
            <input type="checkbox" name="remember" checked>
            <span>Ghi nhớ đăng nhập</span>
          </label>

<!-- SỬA THÀNH THẺ <a> ĐỂ BẤM LÀ SANG LUÔN, KHÔNG BỊ HIỆN ?email= TRÊN URL -->
          <a href="user.html" class="btn btn-primary" style="display: flex; text-decoration: none; justify-content: center; align-items: center;">
            <span>Đăng nhập</span>
            <svg viewBox="0 0 24 24">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
          <p class="form-hint">Quên mật khẩu? Liên hệ bộ phận kỹ thuật để được cấp lại.</p>
        </form>
      </div>
    </main>

  </div>
</body>
</html>
