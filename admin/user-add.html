<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thêm người dùng - TNNT Ceramics</title>
  <link rel="icon" href="sidebar/img/logo.png">
  <link rel="stylesheet" href="css/user.css">
</head>
<body>
  <div class="sidebar-slot">
    <iframe src="sidebar/sidebar.html" title="Menu quản trị"></iframe>
  </div>
  <div class="admin-col">
    <header class="topbar">
      <nav class="breadcrumb-nav" aria-label="Đường dẫn trang">
        <span>Hệ thống quản trị</span>
        <span class="breadcrumb-sep" aria-hidden="true">/</span>
        <a href="user.html">Quản lý người dùng</a>
        <span class="breadcrumb-sep" aria-hidden="true">/</span>
        <span class="breadcrumb-current">Thêm người dùng</span>
      </nav>
      <div class="profile">
        <div class="profile-avatar" aria-hidden="true">AD</div>
        <div class="profile-info">
          <div class="profile-name">Quản lý</div>
          <div class="profile-mail">hgnam@ceramics.vn</div>
        </div>
      </div>
    </header>

    <main class="admin-main user-edit-page">
      <div class="page-header edit-page-header">
        <div class="page-title"><h1>Thêm người dùng</h1></div>
        <div class="edit-page-actions">
          <a class="btn btn-outline" href="user.html">Hủy bỏ</a>
          <button class="btn btn-primary" type="submit" form="add-user-form">Lưu người dùng</button>
        </div>
      </div>

      <section class="edit-card" aria-labelledby="basic-info-title">
        <div class="edit-card-header">
          <div>
            <h2 id="basic-info-title">Thông tin cơ bản</h2>
          </div>
        </div>
        <form id="add-user-form" action="user.html" method="get">
          <div class="edit-card-body">
            <div class="edit-form-grid">
              <div class="form-group">
                <label for="add-code">Mã người dùng</label>
                <span id="add-code" class="user-code-badge">USR-011</span>
              </div>
              <div class="form-group">
                <label for="add-name">Họ và tên</label>
                <input id="add-name" class="form-control" placeholder="Nhập họ và tên...">
              </div>
              <div class="form-group">
                <label for="add-email">Email liên hệ</label>
                <input id="add-email" class="form-control" placeholder="example@ceramics.vn">
              </div>
              <div class="form-group">
                <label for="add-phone">Số điện thoại</label>
                <input id="add-phone" class="form-control" placeholder="0912 xxx xxx">
              </div>
            </div>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
