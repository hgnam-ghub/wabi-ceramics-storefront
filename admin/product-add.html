<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thêm sản phẩm - TNNT Ceramics</title>
  <link rel="icon" href="sidebar/img/logo.png">
  <link rel="stylesheet" href="css/product.css">
</head>
<body>
  <div class="sidebar-slot"><iframe src="sidebar/sidebar.html" title="Menu quản trị"></iframe></div>
  <div class="admin-col">
    <header class="topbar"><nav class="breadcrumb-nav" aria-label="Đường dẫn trang"><span>Hệ thống quản trị</span><span class="breadcrumb-sep">/</span><a href="product.html">Quản lý sản phẩm</a><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">Thêm sản phẩm</span></nav><div class="profile"><div class="profile-avatar">AD</div><div class="profile-info"><div class="profile-name">Quản lý</div><div class="profile-mail">hgnam@ceramics.vn</div></div></div></header>
    <main class="admin-main product-form-page">
      <div class="page-header"><div class="page-title"><h1>Thêm sản phẩm</h1></div><div class="edit-page-actions"><a class="btn btn-outline" href="product.html">Hủy bỏ</a><button class="btn btn-primary" type="submit" form="product-form">Thêm sản phẩm</button></div></div>
      <section class="product-form-card">
        <form id="product-form" action="product.html" method="get">
          <div class="modal-grid">
            <div class="product-details">
              <div class="form-group form-span"><label for="product-name">Tên sản phẩm</label><input class="form-control" id="product-name"></div>
              <div class="form-grid">
                <div class="form-group"><label for="product-code">Mã sản phẩm</label><input class="form-control" id="product-code" value="SP-021" readonly><small class="image-hint">Mã được hệ thống tự động tạo.</small></div>
                <div class="form-group"><label for="product-brand">Thương hiệu</label><input class="form-control" id="product-brand"></div>
                <div class="form-group"><label for="product-category">Phân loại</label><select class="form-control" id="product-category"><option value="">Chọn phân loại</option><option>Ấm chén</option><option>Bát đĩa</option><option>Đồ thờ, bát hương</option><option>Lộc bình, phong thuỷ</option><option>Lọ hoa</option><option>Tượng gốm sứ</option><option>Gốm sứ gia dụng</option></select></div>
                <div class="form-group"><label for="product-price">Giá bán (VNĐ)</label><input class="form-control" id="product-price" inputmode="numeric" autocomplete="off"></div>
              </div>
              <div class="form-group form-span"><label for="product-description">Mô tả chi tiết</label><textarea class="form-control" id="product-description" rows="5"></textarea></div>
            </div>
            <div class="image-column"><label class="image-label" for="product-image">Hình ảnh sản phẩm</label><input id="product-image" type="file" accept="image/*"><small class="image-hint">PNG, JPG tối đa 5MB</small><div class="image-preview-wrap" id="image-preview-wrap" hidden><img id="image-preview" class="image-preview" alt="Xem trước hình ảnh"></div></div>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script>
    const imageInput = document.getElementById('product-image');
    const preview = document.getElementById('image-preview');
    const previewWrap = document.getElementById('image-preview-wrap');
    const priceInput = document.getElementById('product-price');

    function formatPrice(value) {
      const digits = value.replace(/\D/g, '');
      return digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    priceInput.addEventListener('input', function () {
      priceInput.value = formatPrice(priceInput.value);
    });

    document.getElementById('product-form').addEventListener('submit', function () {
      priceInput.value = priceInput.value.replace(/\./g, '');
    });

    imageInput.addEventListener('change', function () {
      const file = imageInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener('load', function () { preview.src = reader.result; previewWrap.hidden = false; });
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
