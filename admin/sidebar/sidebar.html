<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>Quản trị - TNNT Ceramics</title>
  <link rel="stylesheet" href="css/sidebar.css">
</head>
<body class="admin-layout">
  <!-- Sidebar: copy khối <aside> này sang các trang admin khác,
       trang nào đang mở thì gắn class="active" cho <li> của trang đó -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="img/logo.png" alt="Logo TNNT Ceramics">
      <div>
        <strong>TNNT Ceramics</strong>
        <small>Quản trị</small>
      </div>
    </div>

    <nav>
      <p class="menu-title">Quản lý</p>
      <ul class="menu">
        <li data-page="user">
          <a href="../user.html">
              <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Quản lý người dùng</span>
          </a>
        </li>
        <li data-page="product">
          <a href="../product.html">
            <svg viewBox="0 0 24 24">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>Danh sách sản phẩm</span>
          </a>
        </li>
        <li data-page="order">
          <a href="../order.html">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M7 8h10M7 12h10M7 16h6"></path>
            </svg>
            <span>Quản lý đơn hàng</span>
          </a>
        </li>
        <li data-page="order-stats">
          <a href="../order-statistics.html">
            <svg viewBox="0 0 24 24">
              <line x1="4" y1="19" x2="4" y2="10"></line>
              <line x1="10" y1="19" x2="10" y2="5"></line>
              <line x1="16" y1="19" x2="16" y2="13"></line>
              <line x1="22" y1="19" x2="22" y2="2"></line>
            </svg>
            <span>Thống kê đơn hàng</span>
          </a>
        </li>
      </ul>

      <p class="menu-title">Lối tắt</p>
      <ul class="menu">
        <li>
          <a href="../../index.html" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Xem trang bán hàng</span>
          </a>
        </li>
      </ul>
    </nav>

    <a class="logout" href="../login.html">
      <svg viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Đăng xuất</span>
    </a>

  </aside>
  <script>
    (function () {
      var page = window.parent.location.pathname.split('/').pop();
      var activePage = page === 'order-statistics.html' ? 'order-stats' : (page.indexOf('order') === 0 ? 'order' : (page === 'product.html' ? 'product' : 'user'));
      var activeItem = document.querySelector('[data-page="' + activePage + '"]');
      if (activeItem) activeItem.classList.add('active');
    }());
  </script>
</body>
</html>
